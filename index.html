<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hawkins Document Library</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f5f6f8;
  color:#171717;
}

header{
  background:linear-gradient(135deg,#e50909,#ff2020);
  color:white;
  padding:30px 20px 28px;
}

.wrap{
  max-width:1200px;
  margin:auto;
}

.brand{
  font-size:13px;
  font-weight:800;
  letter-spacing:.08em;
  opacity:.9;
}

h1{
  margin:5px 0 4px;
  font-size:30px;
}

.subtitle{
  margin:0;
  opacity:.9;
  font-size:14px;
}

.search{
  margin-top:20px;
  width:100%;
  padding:14px 16px;
  border:0;
  border-radius:12px;
  font-size:16px;
  outline:none;
}

main{
  max-width:1200px;
  margin:auto;
  padding:28px 20px 60px;
}

.category{
  margin-bottom:30px;
}

.category-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}

.category h2{
  margin:0;
  font-size:21px;
}

.count{
  font-size:12px;
  color:#777;
  background:white;
  padding:5px 10px;
  border-radius:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:14px;
}

.card{
  background:white;
  border:1px solid #e4e5e8;
  border-radius:14px;
  padding:16px;
  box-shadow:0 2px 8px rgba(0,0,0,.04);
  transition:.15s;
}

.card:hover{
  transform:translateY(-2px);
  box-shadow:0 5px 18px rgba(0,0,0,.08);
}

.icon{
  font-size:25px;
  margin-bottom:9px;
}

.title{
  font-weight:700;
  font-size:15px;
  line-height:1.35;
  margin-bottom:5px;
}

.filename{
  color:#888;
  font-size:11px;
  word-break:break-word;
  min-height:30px;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:14px;
}

button,.btn{
  border:0;
  border-radius:8px;
  padding:8px 12px;
  font-size:13px;
  cursor:pointer;
  text-decoration:none;
  display:inline-block;
}

.view{
  background:#e50909;
  color:white;
}

.download{
  background:#eeeeee;
  color:#222;
}

.empty{
  text-align:center;
  padding:50px 20px;
  color:#777;
}

.loading{
  text-align:center;
  padding:50px;
  color:#777;
}

/* Viewer */

.viewer{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  z-index:1000;
  display:none;
  flex-direction:column;
}

.viewer.active{
  display:flex;
}

.viewer-top{
  height:55px;
  background:#202020;
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
}

.viewer-title{
  font-size:14px;
  font-weight:600;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.close{
  background:#444;
  color:white;
  font-size:14px;
  padding:8px 14px;
}

.viewer iframe{
  width:100%;
  height:calc(100vh - 55px);
  border:0;
  background:white;
}

/* Mobile */

@media(max-width:600px){
  header{
    padding:24px 15px;
  }

  h1{
    font-size:25px;
  }

  main{
    padding:22px 14px 45px;
  }

  .grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
  }

  .card{
    padding:12px;
  }

  .title{
    font-size:13px;
  }

  .filename{
    font-size:10px;
  }

  .actions{
    flex-direction:column;
  }

  button,.btn{
    width:100%;
    text-align:center;
  }
}
</style>
</head>

<body>

<header>
  <div class="wrap">
    <div class="brand">HAWKINS COOKERS</div>
    <h1>Document Library</h1>
    <p class="subtitle">Dealer schemes, agreements & price lists</p>

    <input
      id="search"
      class="search"
      type="search"
      placeholder="Search documents..."
      oninput="filterDocuments()"
    >
  </div>
</header>

<main id="library">
  <div class="loading">Loading documents...</div>
</main>

<div id="viewer" class="viewer">
  <div class="viewer-top">
    <div id="viewerTitle" class="viewer-title"></div>
    <button class="close" onclick="closeViewer()">Close ✕</button>
  </div>

  <iframe id="pdfViewer"></iframe>
</div>

<script>

const OWNER = "hawkinslibrary";
const REPO = "hawkins-document-library";
const BRANCH = "main";

/* Keep your preferred order */
const CATEGORY_ORDER = [
  "MAS",
  "FRS",
  "HAM",
  "HAS",
  "HAW",
  "HAR",
  "ODD",
  "Agreements",
  "Price List"
];

let allDocuments = [];


/* Static file manifest */
async function loadLibrary(){

  const library = document.getElementById("library");

  try{

    const response = await fetch("files.json?ts=" + Date.now(), {
      cache: "no-store"
    });

    if(!response.ok){
      throw new Error("Unable to load files.json");
    }

    const manifest = await response.json();

    allDocuments = manifest.map(item => ({
      ...item,
      name: cleanName(item.filename),
      type: getType(item.filename)
    }));

    renderLibrary(allDocuments);

  }catch(error){

    library.innerHTML = `
      <div class="empty">
        <h3>Unable to load documents</h3>
        <p>Please refresh the page.</p>
      </div>
    `;

    console.error(error);
  }
}


/* Make filenames look nicer */
function cleanName(filename){

  let name = filename
    .replace(/\.(pdf|xlsx|xls)$/i,"")
    .replace(/[_-]+/g," ")
    .replace(/\s+/g," ")
    .trim();

  /* Remove old timestamp-style endings */
  name = name.replace(/\s+\d{5,}$/,"");

  return name;
}


/* File type */
function getType(filename){

  if(/\.pdf$/i.test(filename)){
    return "pdf";
  }

  return "excel";
}


/* Render everything */
function renderLibrary(documents){

  const library = document.getElementById("library");

  if(!documents.length){
    library.innerHTML = `
      <div class="empty">
        No documents found.
      </div>
    `;
    return;
  }

  const categories = [...new Set(
    documents.map(d => d.category)
  )];

  library.innerHTML = categories.map(category => {

    const docs = documents.filter(
      d => d.category === category
    );

    return `
      <section class="category">

        <div class="category-head">
          <h2>${escapeHTML(category)}</h2>
          <span class="count">
            ${docs.length} document${docs.length === 1 ? "" : "s"}
          </span>
        </div>

        <div class="grid">

          ${docs.map((doc,index) => {

            const id = `${category}-${index}`
              .replace(/[^a-zA-Z0-9-_]/g,"");

            return `
              <article class="card">

                <div class="icon">
                  ${doc.type === "pdf" ? "📄" : "📊"}
                </div>

                <div class="title">
                  ${escapeHTML(doc.name)}
                </div>

                <div class="filename">
                  ${escapeHTML(doc.filename)}
                </div>

                <div class="actions">

                  ${
                    doc.type === "pdf"
                    ?
                    `<button
                      class="view"
                      onclick='openPDF(${JSON.stringify(doc.url)},${JSON.stringify(doc.name)})'
                    >
                      View
                    </button>`
                    :
                    `<a
                      class="btn download"
                      href="${doc.url}"
                      target="_blank"
                      rel="noopener"
                    >
                      Open
                    </a>`
                  }

                  <a
                    class="btn download"
                    href="${doc.url}"
                    target="_blank"
                    rel="noopener"
                    download
                  >
                    Download
                  </a>

                </div>

              </article>
            `;

          }).join("")}

        </div>

      </section>
    `;

  }).join("");
}


/* PDF viewer */
function openPDF(url,title){

  document.getElementById("viewerTitle").textContent = title;

const pagesUrl = url.replace(
  "https://raw.githubusercontent.com/hawkinslibrary/hawkins-document-library/main/",
  "https://hawkinslibrary.github.io/hawkins-document-library/"
);

document.getElementById("pdfViewer").src = pagesUrl;

  document.getElementById("viewer").classList.add("active");

  document.body.style.overflow = "hidden";
}


function closeViewer(){

  document.getElementById("viewer").classList.remove("active");

  document.getElementById("pdfViewer").src = "";

  document.body.style.overflow = "";
}


/* Search */
function filterDocuments(){

  const query =
    document.getElementById("search")
      .value
      .toLowerCase()
      .trim();

  if(!query){

    renderLibrary(allDocuments);
    return;
  }

  const filtered = allDocuments.filter(doc =>
    doc.name.toLowerCase().includes(query) ||
    doc.filename.toLowerCase().includes(query) ||
    doc.category.toLowerCase().includes(query)
  );

  renderLibrary(filtered);
}


/* Prevent HTML injection */
function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* Start */
loadLibrary();

</script>

</body>
</html>
